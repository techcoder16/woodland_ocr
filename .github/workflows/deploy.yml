name: Deploy OCR

# dev branch  -> dev  (account 623553998786)
# main branch -> prod (account 549803795489)
# Same tagging as the backend: sha-<commit> forever, vX.Y.Z per prod release,
# moving dev/prod tag for ECS.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release bump for main (prod)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  id-token: write
  contents: write # push release tags

concurrency:
  group: deploy-ocr-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  REPO: woodland/ocr

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick environment
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "ENV=prod" >> "$GITHUB_ENV"; echo "ACCOUNT=549803795489" >> "$GITHUB_ENV"
          else
            echo "ENV=dev" >> "$GITHUB_ENV"; echo "ACCOUNT=623553998786" >> "$GITHUB_ENV"
          fi

      - name: Work out release version (main only)
        if: env.ENV == 'prod'
        env:
          BUMP_INPUT: ${{ github.event.inputs.bump }}
        run: |
          git fetch --tags --force -q
          LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          LAST=${LAST:-v1.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<<"${LAST#v}"
          MSG=$(git log -1 --pretty=%B)
          BUMP=${BUMP_INPUT:-patch}
          if [ -z "$BUMP_INPUT" ]; then
            if grep -qi '#major' <<<"$MSG"; then BUMP=major; elif grep -qi '#minor' <<<"$MSG"; then BUMP=minor; fi
          fi
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *)     PATCH=$((PATCH+1)) ;;
          esac
          echo "VERSION=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_ENV"
          echo "Release v$MAJOR.$MINOR.$PATCH ($BUMP, previous $LAST)" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/woodland-${{ env.ENV }}-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$REPO"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "SHA_TAG=$SHA_TAG" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:$SHA_TAG" .
          docker push "$IMAGE:$SHA_TAG"
          if [ "$ENV" = "prod" ]; then
            docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
          fi

      - name: Move ${{ env.ENV }} tag (remember the previous image)
        run: |
          PREV=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$ENV" --query 'images[0].imageManifest' --output text || true)
          if [ -n "$PREV" ] && [ "$PREV" != "None" ]; then printf '%s' "$PREV" > prev-manifest.json; fi
          NEW=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$SHA_TAG" --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name "$REPO" --image-tag "$ENV" --image-manifest "$NEW" >/dev/null 2>&1 \
            || echo "tag $ENV already points at $SHA_TAG"

      - name: Roll out
        run: |
          aws ecs update-service --cluster "woodland-$ENV" --service "woodland-$ENV-ocr" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "woodland-$ENV" --services "woodland-$ENV-ocr"
          echo "Deployed $SHA_TAG to $ENV" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag release
        if: env.ENV == 'prod' && success()
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "$VERSION" -m "Release $VERSION (${GITHUB_SHA::7})"
          git push origin "$VERSION"

      - name: Restore previous image on failure
        if: failure()
        run: |
          if [ -f prev-manifest.json ]; then
            aws ecr put-image --repository-name "$REPO" --image-tag "$ENV" --image-manifest "$(cat prev-manifest.json)" >/dev/null 2>&1 || true
            aws ecs update-service --cluster "woodland-$ENV" --service "woodland-$ENV-ocr" --force-new-deployment >/dev/null
            echo "Rolled $ENV back to the previous image" >> "$GITHUB_STEP_SUMMARY"
          fi
